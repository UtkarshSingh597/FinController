global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape FastAPI Backend Telemetry
  - job_name: "fincontrol-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]

  # Scrape Prometheus Self-metrics
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
