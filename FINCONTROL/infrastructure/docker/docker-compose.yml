version: "3.8"

services:
  # ============================================================================
  # 1. PostgreSQL 16 (Single Source of Financial Truth)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: fincontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fincontrol}
      POSTGRES_USER: ${POSTGRES_USER:-fincontrol_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fincontrol_secret_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fincontrol_user} -d ${POSTGRES_DB:-fincontrol}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Redis 7 (Caching & Rate Limiting)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: fincontrol-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================================
  # 3. FastAPI Backend Application
  # ============================================================================
  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: fincontrol-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-fincontrol_user}:${POSTGRES_PASSWORD:-fincontrol_secret_pass}@postgres:5432/${POSTGRES_DB:-fincontrol}
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:8b
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-fincontrol_dev_super_secret_jwt_key_2026}
      - ENVIRONMENT=production
    ports:
      - "8000:8000"

  # ============================================================================
  # 5. Next.js 15 Frontend
  # ============================================================================
  frontend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: fincontrol-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"

  # ============================================================================
  # 6. Nginx Edge Reverse Proxy
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: fincontrol-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/fincontrol.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
